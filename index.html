<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beacon — AI Visibility Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --panel:#FFFFFF; --panel-2:#FBF9F4;
    --ink:#191712; --ink-soft:#524E45; --muted:#8C8678; --hair:#E7E1D4; --hair-2:#EFEADF;
    --brand:#0E5A4C; --brand-soft:#E4EFEA; --brand-ink:#0A3C32;
    --crit:#B23A2E; --high:#C2710C; --med:#B59005; --good:#2E7D45; --exc:#0E5A4C;
    --crit-bg:#F8E7E3; --high-bg:#FBEEDC; --med-bg:#F7F0D6; --good-bg:#E4F1E5;
    --shadow:0 1px 2px rgba(25,23,18,.04), 0 8px 24px -12px rgba(25,23,18,.14);
    --shadow-lg:0 2px 4px rgba(25,23,18,.05), 0 24px 48px -20px rgba(25,23,18,.22);
    --r:16px; --r-sm:11px;
    --serif:"Fraunces",Georgia,serif; --sans:"Hanken Grotesk",system-ui,sans-serif; --mono:"Spline Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
    background-image:radial-gradient(circle at 1px 1px, rgba(25,23,18,.022) 1px, transparent 0);background-size:22px 22px}
  ::selection{background:var(--brand);color:#fff}
  a{color:inherit;text-decoration:none}
  .app{display:grid;grid-template-columns:266px 1fr;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .side{border-right:1px solid var(--hair);background:var(--panel-2);padding:22px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:11px;padding:2px 6px}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 12px -4px rgba(14,90,76,.6)}
  .brand .mark svg{width:19px;height:19px}
  .brand b{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.02em}
  .brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-top:-2px}

  .ws-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 8px;margin-bottom:9px}
  .ws{display:flex;flex-direction:column;gap:6px}
  .ws button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:9px 10px;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--ink-soft);transition:.18s}
  .ws button:hover{background:#fff;border-color:var(--hair)}
  .ws button.on{background:#fff;border-color:var(--hair);box-shadow:var(--shadow);color:var(--ink)}
  .ws .fav{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:14px;color:#fff}
  .ws .meta{min-width:0}
  .ws .meta b{font-weight:600;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ws .meta span{font-size:11px;color:var(--muted)}
  .ws .scorepip{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:7px}

  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:12px;background:transparent;border:none;border-radius:10px;padding:9px 11px;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--ink-soft);transition:.15s;width:100%;text-align:left}
  .nav button svg{width:17px;height:17px;opacity:.7;flex:none}
  .nav button:hover{background:#fff;color:var(--ink)}
  .nav button.on{background:var(--brand);color:#fff}
  .nav button.on svg{opacity:1}
  .nav .badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.22);padding:1px 7px;border-radius:20px}
  .nav button:not(.on) .badge{background:var(--hair-2);color:var(--ink-soft)}

  .side-foot{margin-top:auto;padding:13px;border-radius:13px;background:linear-gradient(150deg,#10312b,#0a221d);color:#dfe9e4;font-size:12px;line-height:1.45}
  .side-foot b{color:#fff;font-weight:600;font-family:var(--serif)}
  .side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5ec4a8;margin-right:6px;box-shadow:0 0 0 3px rgba(94,196,168,.2)}

  /* ---------- Main ---------- */
  .main{padding:30px 38px 64px;max-width:1180px}
  .crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:14px}
  .crumbs .sep{opacity:.5}
  .head{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .head h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:-.02em;line-height:1.1}
  .head .sub{color:var(--muted);font-size:13.5px;margin-top:5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .head .url{color:var(--brand);font-weight:600}
  .chip-type{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand-ink)}
  .head .right{margin-left:auto;display:flex;gap:9px;align-items:center}
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;border:1px solid var(--hair);background:#fff;color:var(--ink-soft);padding:8px 13px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .btn:hover{border-color:#cfc8b8;color:var(--ink)}
  .btn svg{width:15px;height:15px}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:#0a4034;color:#fff}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:16px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
  .card .klabel{font-size:13px;font-weight:600;color:var(--ink)}
  .card .ksub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .kpi-ring{display:flex;align-items:center;gap:18px;margin-top:6px}
  .ring{position:relative;flex:none}
  .ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring .val b{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1}
  .ring .val span{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em}
  .band{font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;display:inline-block}
  .kpi-line{margin-top:4px;font-size:12.5px;color:var(--ink-soft)}
  .bignum{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;letter-spacing:-.02em;margin-top:12px}
  .bignum small{font-size:16px;color:var(--muted);font-weight:500;font-family:var(--sans)}
  .meter{height:8px;border-radius:6px;background:var(--hair-2);overflow:hidden;margin-top:13px}
  .meter i{display:block;height:100%;border-radius:6px}
  .pres-note{font-size:11.5px;color:var(--muted);margin-top:9px}

  /* Section panels */
  .panel{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);margin-top:20px;overflow:hidden}
  .panel-h{padding:18px 22px;border-bottom:1px solid var(--hair-2);display:flex;align-items:center;gap:12px}
  .panel-h h2{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.01em}
  .panel-h p{font-size:12.5px;color:var(--muted)}
  .panel-h .pill{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft);background:var(--panel-2);border:1px solid var(--hair);padding:3px 10px;border-radius:20px}

  /* Prompt table */
  .ptable{width:100%;border-collapse:collapse}
  .ptable th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 22px;border-bottom:1px solid var(--hair-2)}
  .ptable td{padding:15px 22px;border-bottom:1px solid var(--hair-2);vertical-align:middle}
  .ptable tr:last-child td{border-bottom:none}
  .ptable tbody tr{transition:background .14s}
  .ptable tbody tr:hover{background:var(--panel-2)}
  .prompt-q{font-weight:600;font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:9px}
  .prompt-owner{font-size:12px;color:var(--muted);margin-top:3px}
  .prompt-owner b{color:var(--ink-soft);font-weight:600}
  .tchip{font-family:var(--mono);font-size:10px;font-weight:600;width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;flex:none}
  .vis-badge{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:14px;border:2.5px solid}
  .verdict{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .sev-tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px}

  /* Categories */
  .cats{padding:8px 22px 18px}
  .catrow{display:grid;grid-template-columns:200px 1fr 54px;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--hair-2)}
  .catrow:last-child{border-bottom:none}
  .catrow .cname{font-weight:600;font-size:14px}
  .catrow .cw{font-size:11.5px;color:var(--muted);font-weight:500}
  .cbar{height:10px;border-radius:6px;background:var(--hair-2);overflow:hidden}
  .cbar i{display:block;height:100%;border-radius:6px;transform-origin:left}
  .cscore{font-family:var(--mono);font-weight:600;font-size:15px;text-align:right}

  /* Issues */
  .iss-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 22px 6px}
  .iss-stat{border:1px solid var(--hair);border-radius:13px;padding:15px;text-align:center}
  .iss-stat b{font-family:var(--serif);font-size:32px;font-weight:600;display:block;line-height:1}
  .iss-stat span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .iss-list{padding:6px 22px 18px}
  .iss-item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--hair-2)}
  .iss-item:last-child{border-bottom:none}
  .iss-item .num{font-family:var(--mono);color:var(--muted);font-size:13px;font-weight:600;flex:none;width:22px}
  .iss-item .txt{font-size:13.5px;color:var(--ink-soft);line-height:1.5}
  .iss-item .txt b{color:var(--ink);font-weight:600}

  /* Action plan */
  .weeks{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:20px 22px}
  .week{border:1px solid var(--hair);border-radius:14px;padding:17px 18px;background:var(--panel-2)}
  .week h3{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:3px}
  .week .wk{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:700}
  .week ul{list-style:none;margin-top:11px;display:flex;flex-direction:column;gap:9px}
  .week li{display:flex;gap:9px;font-size:13px;color:var(--ink-soft);line-height:1.45}
  .week li svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--brand)}

  .wins{padding:18px 22px;display:flex;flex-direction:column;gap:11px}
  .win{display:flex;gap:12px;align-items:flex-start}
  .win .n{width:24px;height:24px;border-radius:8px;background:var(--brand-soft);color:var(--brand-ink);font-family:var(--mono);font-weight:600;font-size:12px;display:grid;place-items:center;flex:none}
  .win p{font-size:13.5px;color:var(--ink-soft)}
  .win p b{color:var(--ink);font-weight:600}

  /* Fixes & artifacts */
  .fix-intro{padding:17px 22px;font-size:13.5px;color:var(--ink-soft);line-height:1.55;border-bottom:1px solid var(--hair-2)}
  .fix-intro b{color:var(--ink)}
  .fixcards{padding:14px 22px 18px;display:flex;flex-direction:column;gap:12px}
  .fixcard{border:1px solid var(--hair);border-radius:13px;padding:14px 16px;background:var(--panel-2)}
  .fixcard .fh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .fixcard .fh b{font-weight:700;font-size:14.5px}
  .fixcard .fn{width:23px;height:23px;border-radius:7px;background:var(--brand-soft);color:var(--brand-ink);font-family:var(--mono);font-weight:600;font-size:12px;display:grid;place-items:center;flex:none}
  .fixcard .row{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-top:5px}
  .fixcard .row b{color:var(--ink);font-weight:600}
  .art{margin:0 22px 16px;border:1px solid var(--hair);border-radius:13px;overflow:hidden}
  .art-h{display:flex;align-items:center;gap:10px;padding:11px 15px;background:var(--panel-2);border-bottom:1px solid var(--hair-2)}
  .art-h b{font-weight:700;font-size:13.5px;font-family:var(--mono)}
  .art-h .where{font-size:11.5px;color:var(--muted)}
  .art-h .copy{margin-left:auto;font-family:var(--sans);font-size:12px;font-weight:600;border:1px solid var(--hair);background:#fff;color:var(--ink-soft);padding:6px 12px;border-radius:8px;cursor:pointer;transition:.15s}
  .art-h .copy:hover{border-color:var(--brand);color:var(--brand)}
  .art-desc{padding:10px 15px;font-size:12.5px;color:var(--ink-soft);background:#fff;border-bottom:1px solid var(--hair-2);line-height:1.5}
  .art pre{margin:0;padding:14px 16px;background:#15140f;color:#e7e2d6;font-family:var(--mono);font-size:11px;line-height:1.55;overflow:auto;max-height:360px;white-space:pre}
  .foot{margin-top:30px;font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--hair);padding-top:16px}
  .foot b{color:var(--ink-soft)}

  .reveal{opacity:0;transform:translateY(10px);animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
  @keyframes rise{to{opacity:1;transform:none}}
  .hide{display:none!important}

  @media(max-width:920px){
    .app{grid-template-columns:1fr}
    .side{position:static;height:auto;flex-direction:column}
    .kpis{grid-template-columns:1fr 1fr}
    .weeks,.iss-grid{grid-template-columns:1fr 1fr}
    .main{padding:24px 18px 50px}
    .catrow{grid-template-columns:130px 1fr 44px}
  }
</style>
</head>

<div id="gate" style="position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#10312b,#081915);display:grid;place-items:center;font-family:system-ui,sans-serif">
  <div style="text-align:center;color:#e9efea;max-width:360px;padding:28px">
    <div style="width:48px;height:48px;border-radius:13px;background:#5ec4a8;display:grid;place-items:center;margin:0 auto 16px;font-family:Georgia,serif;font-weight:800;font-size:24px;color:#081915">B</div>
    <div style="font-family:Georgia,serif;font-size:26px;font-weight:600">Beacon</div>
    <div style="font-size:12px;color:#7fb8a8;margin:4px 0 24px;letter-spacing:.16em;text-transform:uppercase">AI Visibility · Client Preview</div>
    <input id="pw" type="password" placeholder="Access password" autofocus style="width:100%;padding:12px 15px;border-radius:11px;border:1px solid #2c5c52;background:#0a221d;color:#fff;font-size:15px;outline:none;box-sizing:border-box">
    <button id="go" style="width:100%;margin-top:11px;padding:12px;border-radius:11px;border:none;background:#5ec4a8;color:#081915;font-weight:700;font-size:15px;cursor:pointer">View report</button>
    <div id="err" style="color:#e07d6c;font-size:12.5px;margin-top:11px;height:15px"></div>
  </div>
</div>
<script>
(function(){var PW="eva2026";
function go(){var v=document.getElementById("pw").value;if(v===PW){document.getElementById("gate").style.display="none";try{sessionStorage.setItem("bk","1")}catch(e){}}else{document.getElementById("err").textContent="Incorrect password"}}
document.getElementById("go").addEventListener("click",go);
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")go()});
try{if(sessionStorage.getItem("bk")==="1")document.getElementById("gate").style.display="none"}catch(e){}
})();
</script>

  </aside>

  <!-- MAIN -->
  <main class="main" id="main"></main>
</div>

function ringSVG(score,size=88,sw=9){
  const r=(size-sw)/2, c=2*Math.PI*r, off=c*(1-score/100), col=scoreColor(score);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EFEADF" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}
function visBadge(v){const col=scoreColor(v);return `<span class="vis-badge" style="border-color:${col};color:${col}">${v}</span>`;}

}

    <div class="panel-h"><h2>30-Day Action Plan</h2><p>From machine-readable identity → off-site authority</p></div>
    <div class="weeks">${d.weeks.map(([wk,h,items])=>`
      <div class="week"><div class="wk">${wk}</div><h3>${h}</h3><ul>${items.map(it=>`<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>${it}</li>`).join('')}</ul></div>`).join('')}</div>
  </div>`;
}

const FOOT = `<div class="foot reveal" style="--d:.32s"><b>How to read this.</b> "AI Answer Presence" is the share of high-intent buyer prompts where the brand is actually cited by AI engines today — the single number that says "are my clients showing up." The GEO Visibility Score is the composite of six citability dimensions. <br><b>Methodology.</b> Prompt visibility derived from live SERP/answer-source analysis (which pages AI synthesises from) on 1 Jun 2026; in production this is replaced by direct daily LLM querying. A prototype built from real audit data — brand &amp; UI are placeholders.</div>`;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyArt(btn){var pre=btn.closest('.art').querySelector('pre');navigator.clipboard.writeText(pre.textContent).then(function(){var o=btn.textContent;btn.textContent='Copied ✓';setTimeout(function(){btn.textContent=o;},1500);});}

function fixesPanel(d){
  return `<div class="panel reveal" style="--d:.08s">
    <div class="panel-h"><h2>What to Improve &amp; Why</h2><p>The highest-leverage fixes, in plain English</p></div>
    <div class="fix-intro">The website itself is rarely the bottleneck — what blocks AI citations is <b>off-site authority</b> (sources AI can independently cite) and <b>machine-readable identity</b> (schema). These are the fixes that actually move the visibility score, ordered by impact.</div>
    <div class="fixcards">${d.fixCards.map((f,i)=>{const[c,bg]=SEV[f.sev];return `
      <div class="fixcard">
        <div class="fh"><span class="fn">${i+1}</span><b>${f.title}</b><span class="sev-tag" style="color:${c};background:${bg};margin-left:auto">${f.sev}</span></div>
        <div class="row"><b>Why it matters — </b>${f.why}</div>
        <div class="row"><b>How to fix — </b>${f.how}</div>
      </div>`;}).join('')}</div>
  </div>
  <div class="panel reveal" style="--d:.14s">
    <div class="panel-h"><h2>Ready-to-Paste Artifacts</h2><p>Copy these straight into the site</p><span class="pill">${d.artifacts.length} files</span></div>
    ${d.artifacts.map(a=>`
      <div class="art">
        <div class="art-h"><b>${a.name}</b><span class="where">${a.where}</span><button class="copy" onclick="copyArt(this)">Copy</button></div>
        <div class="art-desc">${a.desc}</div>
        <pre>${esc(a.code)}</pre>
      </div>`).join('')}
  </div>`;
}

function render(){
  const d=DATA[cur];
  let body=head(d);
  if(tab==='overview') body+=kpis(d)+catPanel(d)+promptTable(d)+FOOT;
  else if(tab==='prompts') body+=kpis(d)+promptTable(d)+FOOT;
  else if(tab==='visibility') body+=kpis(d)+catPanel(d)+FOOT;
  else if(tab==='issues') body+=kpis(d)+issuesPanel(d)+FOOT;
  else if(tab==='fixes') body+=fixesPanel(d)+FOOT;
  else if(tab==='plan') body+=planPanel(d)+FOOT;
  document.getElementById('main').innerHTML=body;
  renderSidebar();
}
function setSite(k){cur=k;render();window.scrollTo(0,0);}
function setTab(t){tab=t;render();window.scrollTo(0,0);}
render();
</script>
</body>
</html>
